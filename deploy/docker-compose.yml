# 数据布局(2026-10-11 I4 验收后定稿):
#   全部持久化数据落在 compose 文件同级的 ./data/ 下(bind mount,便于备份与巡检;
#   由 named volume 迁移的部署见 ops/DEPLOY-LOG 的一次性迁移步骤)。
#   ./data/panel        panel 数据库/渲染产物/头像(uid 100)
#   ./data/caddy        Caddy 证书存储(storage 根在其 caddy/ 子目录,uid 100)
#   ./data/caddy-config Caddy autosave(uid 100)
#   ./data/logs         访问/错误日志(caddy 写、panel 读,双方 uid 均为 100 → 0600 可读,I4-D2)
#   ./data/cert-uploads 手动上传证书(panel 写、caddy 读,I4-D12)
# 权限约束:caddy 以 user "100:101" 运行(与 panel 镜像内用户一致),绑定 <1024 端口
#   依赖下方 cap_add NET_BIND_SERVICE;首次部署或迁移后需一次性:
#   chown -R 100:101 ./data/{caddy,caddy-config,logs,cert-uploads}
services:
  caddy:
    # 带插件镜像(GH Actions 构建推 GHCR,服务器 pull 部署);
    # build 段保留:本地/离线场景可 `docker compose build` 自行构建。
    image: ghcr.io/realqingtian/caddy-plugins:${CADDY_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    # 与 panel 容器内用户(uid/gid 100:101)对齐:写出的日志/证书文件 0600 对 panel 可读(I4-D2)
    user: "100:101"
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # l4 透传站点示例端口(T3.4);业务端口按需追加
      - "8433:8433"
      - "15353:15353/udp"
    volumes:
      - ./caddy/Caddyfile.initial:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
      # 访问/错误日志,与 panel 共享以支撑日志 tail(FR-501)
      - ./data/logs:/data/logs
      # 手动上传证书(panel 写 / caddy 读;渲染 tls 指令用同一绝对路径,I4-D12)
      - ./data/cert-uploads:/cert-data

  panel:
    # 面板镜像(GH Actions 构建推 GHCR);build 段保留为本地构建备选。
    image: ghcr.io/realqingtian/caddy-panel:${PANEL_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/panel.Dockerfile
    restart: unless-stopped
    depends_on:
      - caddy
    # 可调变量均以 ${VAR:-默认} 形式引用:deploy/.env(compose 自动读取)即可覆盖,
    # 全量变量与注释见 .env.example;容器内部布局路径固定,不放开。
    environment:
      PANEL_LISTEN: ":8080"
      PANEL_MODE: "${PANEL_MODE:-release}"
      # 首次启动管理员密码;未设置时由面板随机生成并打印到启动日志(仅一次)。
      PANEL_ADMIN_PASSWORD: "${PANEL_ADMIN_PASSWORD:-}"
      # 多节点 Agent 安装命令所需的对外地址(设置页可事后补配)。
      PANEL_PUBLIC_URL: "${PANEL_PUBLIC_URL:-}"
      # M1 经 compose 内网访问 Admin API;生产建议 sidecar 共享 netns + unix socket,
      # 届时改为 PANEL_ADMIN_URL=unix:///run/caddy/admin.sock(client 已按协议区分)。
      # 不映射宿主机端口,Admin API 不会暴露到容器网络之外(NFR-101)。
      PANEL_ADMIN_URL: "${PANEL_ADMIN_URL:-http://caddy:2019}"
      # 渲染全局块的 Caddy admin 绑定:必须与 caddy 容器可达地址一致,
      # 否则 /load 后 Panel 将失去与 Admin API 的连接。
      PANEL_CADDY_ADMIN_BIND: "${PANEL_CADDY_ADMIN_BIND:-caddy:2019}"
      # 登录会话与登录锁定(env 只作默认值;JWT 相关仅此处可配)。
      PANEL_JWT_SECRET: "${PANEL_JWT_SECRET:-}"
      PANEL_JWT_TTL: "${PANEL_JWT_TTL:-24h}"
      PANEL_LOGIN_MAX_FAILS: "${PANEL_LOGIN_MAX_FAILS:-5}"
      PANEL_LOGIN_LOCK_WINDOW: "${PANEL_LOGIN_LOCK_WINDOW:-1m}"
      # Caddy 证书存储根:panel 把 caddy 数据卷挂到 /data/caddy,
      # Caddy 的 storage 根在卷内 caddy/ 子目录 → 必须指到 /data/caddy/caddy(I4-D5)
      PANEL_CERT_STORAGE_PATH: "${PANEL_CERT_STORAGE_PATH:-/data/caddy/caddy}"
      # 手动上传证书目录:cert-uploads 卷,panel 可写、caddy 同路径只读可读(I4-D12)
      PANEL_CERT_UPLOAD_PATH: "${PANEL_CERT_UPLOAD_PATH:-/cert-data}"
      # 容器内部布局(卷对应,勿改):DB/Caddyfile/日志路径。
      PANEL_DB_PATH: "/data/panel.db"
      PANEL_CADDYFILE_PATH: "/data/Caddyfile"
      PANEL_LOG_ACCESS_PATH: "/data/logs/access.log"
      PANEL_LOG_ERROR_PATH: "/data/logs/error.log"
    ports:
      # 只监听本机回环:外部访问一律走 Caddy 反代,8080 不应出现在任何外部接口(纵深防御)
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/panel:/data
      - ./data/logs:/data/logs
      # 证书状态查看(FR-308):只读共享 Caddy 证书存储
      - ./data/caddy:/data/caddy:ro
      # 手动上传证书(panel 侧可写)
      - ./data/cert-uploads:/cert-data

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (go vet / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum
      # swag 生成物不入库(gitignore 约定),编译前先生成(main.go import docs_swag)。
      # go run 方式免去 GOPATH/bin 的 PATH 问题与 YAML 引号转义。
      - name: Generate OpenAPI docs
        working-directory: backend
        run: go run github.com/swaggo/swag/cmd/swag@latest init -g cmd/panel/main.go -o docs_swag
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: go test
        working-directory: backend
        run: go test ./...
      - name: go build
        working-directory: backend
        run: go build ./...

  frontend:
    name: Frontend (lint / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Lint (ESLint + Prettier)
        working-directory: frontend
        run: bun run lint
      - name: Build (tsc + vite → backend embed dist)
        working-directory: frontend
        run: bun run build
